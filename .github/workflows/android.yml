name: NEON LOCK - APK Android
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build signed debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK file
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Verify 3D dial graphic included in APK
        run: unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -q 'neon_vault_reference' && unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -q 'neon_vault_wheel_clean' && unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -q 'neon_vault_center_clean'
      - name: Publish APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEON-LOCK-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Prepare APK name
        run: cp app/build/outputs/apk/debug/app-debug.apk NEON-LOCK-v1.2.2.apk
      - name: Create/update download release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.2.2 >/dev/null 2>&1 || gh release create v1.2.2 --title "NEON LOCK v1.2.2" --notes "APK Android de test signée (debug). Affiche l'heure et les secondes directement sur le disque central 3D, sans rectangle noir. Le visuel central a ete nettoye de l'heure imprimee; chiffres de la roue toujours droits et personnalisations conservees. Sans accès sensible. Ne remplace pas le verrouillage sécurisé Android."
          gh release upload v1.2.2 NEON-LOCK-v1.2.2.apk --clobber
