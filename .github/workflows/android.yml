name: NEON LOCK - Android APK and secure releases
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35" || "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # CI compilation always runs, even before the owner configures a private signing key.
      - name: Compile debug APK and verify code
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Run JVM regression tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Verify twelve theme assets and configuration
        run: |
          grep -q "COUNT=12" app/src/main/java/com/creatix/neonlock/ThemePrefs.java
          grep -q "ThemeTexture.draw" app/src/main/java/com/creatix/neonlock/ThemeArt.java
          grep -q "versionCode 20" app/build.gradle
          test -s app/src/main/res/drawable-nodpi/neon_v140_hd_atlas.jpg
          test -s app/src/main/java/com/creatix/neonlock/ThemeDesignerActivity.java
          test -s app/src/main/java/com/creatix/neonlock/DiagnosticsActivity.java
          test -s app/src/main/java/com/creatix/neonlock/SceneArt.java
          grep -q 'case ThemePrefs.OCEAN\|id==ThemePrefs.OCEAN' app/src/main/java/com/creatix/neonlock/SceneArt.java
          grep -q 'SceneArt.newScene' app/src/main/java/com/creatix/neonlock/ThemeArt.java
          grep -q 'ThemePrefs.COUNT+1' app/src/main/java/com/creatix/neonlock/ThemeGalleryActivity.java
      - name: Verify embedded 3D artwork
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -q 'neon_vault_reference'
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -q 'neon_vault_wheel_clean'
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -q 'neon_vault_center_clean'
          unzip -Z1 app/build/outputs/apk/debug/app-debug.apk | grep -q 'neon_v140_hd_atlas'
      - name: Publish CI build for debugging only
        uses: actions/upload-artifact@v4
        with:
          name: NEON-LOCK-CI-DEBUG-NOT-FOR-UPDATES
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Public repository: never commit or upload a keystore to git or release assets.
      - name: Load persistent signing key privately
        if: github.event_name != 'pull_request'
        env:
          NEON_KEYSTORE_BASE64: ${{ secrets.NEON_KEYSTORE_BASE64 }}
          NEON_SIGNING_PASSWORD: ${{ secrets.NEON_SIGNING_PASSWORD }}
        run: |
          if [[ -n "$NEON_KEYSTORE_BASE64" && -n "$NEON_SIGNING_PASSWORD" ]]; then
            umask 077
            printf '%s' "$NEON_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/neon-release.jks"
            test -s "$RUNNER_TEMP/neon-release.jks"
            echo "NEON_SIGNING_STORE_FILE=$RUNNER_TEMP/neon-release.jks" >> "$GITHUB_ENV"
            echo "NEON_SIGNING_READY=true" >> "$GITHUB_ENV"
          elif [[ -n "$NEON_KEYSTORE_BASE64" || -n "$NEON_SIGNING_PASSWORD" ]]; then
            echo "::error::Only one of the required signing Secrets is set. Set both."
            exit 1
          else
            echo "::warning::Release not published. Configure NEON_KEYSTORE_BASE64 and NEON_SIGNING_PASSWORD in GitHub Actions Secrets. A temporary debug key cannot update existing installs."
            echo "NEON_SIGNING_READY=false" >> "$GITHUB_ENV"
          fi

      - name: Build release with persistent private signing key
        if: env.NEON_SIGNING_READY == 'true'
        env:
          NEON_SIGNING_PASSWORD: ${{ secrets.NEON_SIGNING_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Verify APK signature and release artifact
        if: env.NEON_SIGNING_READY == 'true'
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -qi '96ef5146ed4c1d0a6531d316e40e2fab7354fcc02c5e2890ceb82fef24c4f1cc'
          # AAPT2 can shorten resource filenames in release APKs; verify the
          # archive and manifest rather than grepping a source resource name.
          unzip -t app/build/outputs/apk/release/app-release.apk >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep -q "package: name='com.creatix.neonlock'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep -q "versionCode='20'"
          cp app/build/outputs/apk/release/app-release.apk NEON-LOCK-v1.4.1.apk
      - name: Publish installable signed release artifact
        if: env.NEON_SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NEON-LOCK-v1.4.1-SIGNED
          path: NEON-LOCK-v1.4.1.apk
          if-no-files-found: error
      - name: Create/update downloadable GitHub Release
        if: env.NEON_SIGNING_READY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.4.1 >/dev/null 2>&1 || gh release create v1.4.1 --title "NEON LOCK v1.4.1" --notes "Immersive Environments : 12 fonds animes avec cinq nouveaux themes Neon Grid, Frost Core, Lava Core, Shadow Tech et Ocean Pulse. Les six themes precedents recoivent des decors pleine surface, structures et animations exterieures non limitees au cercle. Vault Original reste inchange, les reglages, les presets, le mode economie, la parallaxe, le diagnostic et l heure HH:mm sont conserves. APK signee avec la meme cle privee que v1.4.0 et installable par-dessus."
          gh release upload v1.4.1 NEON-LOCK-v1.4.1.apk --clobber
